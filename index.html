<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BATTLE ROYALE | TikTok Interactive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --primary: #00ff41;
        --primary-glow: rgba(0, 255, 65, 0.4);
        --accent: #00e5ff;
        --bg-dark: #0a0a0a;
        --panel-bg: rgba(20, 20, 20, 0.85);
        --glass-border: rgba(255, 255, 255, 0.1);
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      
      body { 
        background: var(--bg-dark); 
        color: white;
        display: flex; 
        justify-content: center; 
        align-items: center; 
        height: 100vh; 
        overflow: hidden;
        font-family: 'Inter', sans-serif;
      }

      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      canvas { 
        display: block; 
        width: 100%;
        height: 100%;
      }

      /* Premium Panel Style */
      #connector {
        position: absolute;
        z-index: 500;
        background: rgba(10, 15, 25, 0.95);
        padding: 3rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 32px;
        backdrop-filter: blur(40px);
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        width: 380px;
        max-width: 90vw;
        box-shadow: 0 40px 100px rgba(0,0,0,0.9), 0 0 40px rgba(0, 255, 65, 0.1);
        transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        border-top: 1px solid rgba(255, 255, 255, 0.2);
      }

      #connector h1 {
        font-family: 'Orbitron', sans-serif;
        font-size: 1.6rem;
        text-align: center;
        letter-spacing: 6px;
        margin-bottom: 0.5rem;
        background: linear-gradient(180deg, #fff 0%, var(--primary) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 900;
      }

      #close-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #fff;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        transition: all 0.3s;
      }

      #close-btn:hover {
        background: rgba(255, 0, 0, 0.4);
        border-color: #ff0000;
        transform: rotate(90deg);
      }

      .input-group {
        position: relative;
      }

      input {
        width: 100%;
        padding: 1.2rem 1.5rem;
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
        border-radius: 16px;
        font-size: 1rem;
        outline: none;
        transition: all 0.3s;
        font-family: 'Inter', sans-serif;
        text-align: center;
      }

      input:focus {
        border-color: var(--primary);
        background: rgba(0, 255, 65, 0.05);
        box-shadow: 0 0 20px var(--primary-glow);
      }

      .btn-container {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      button {
        padding: 1.2rem;
        border: none;
        font-weight: 900;
        cursor: pointer;
        border-radius: 16px;
        font-family: 'Orbitron', sans-serif;
        font-size: 1rem;
        text-transform: uppercase;
        letter-spacing: 3px;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      #connect-btn {
        background: linear-gradient(90deg, var(--primary), #00e5ff);
        color: black;
        box-shadow: 0 10px 20px rgba(0, 255, 65, 0.3);
      }

      #connect-btn:hover {
        transform: translateY(-4px);
        box-shadow: 0 20px 40px rgba(0, 255, 65, 0.4);
      }

      #test-btn {
        background: rgba(255, 255, 255, 0.03);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      #test-btn:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: var(--accent);
        color: var(--accent);
      }

      #status-container {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-top: 10px;
        padding: 10px;
        background: rgba(0,0,0,0.2);
        border-radius: 12px;
      }

      .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #ff3e3e;
      }

      .status-dot.online {
        background: var(--primary);
        box-shadow: 0 0 12px var(--primary);
        animation: pulse 2s infinite;
      }

      #status { 
        color: rgba(255,255,255,0.5); 
        font-size: 0.8rem; 
        font-weight: 700;
      }

      .hidden {
        opacity: 0;
        pointer-events: none;
        transform: scale(0.95) translateY(30px);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="connector">
        <button id="close-btn" title="Hide Menu">✕</button>
        <h1>BATTLE ARENA</h1>
        
        <div class="input-group">
          <input type="text" id="username" placeholder="TikTok Username" autocomplete="off" />
        </div>

        <div class="btn-container">
          <button id="connect-btn">Connect Live</button>
          <button id="disconnect-btn" style="display: none; background: #333; color: white;">Disconnect</button>
          <button id="test-btn">Test Arena Mode</button>
        </div>

        <div id="status-container">
          <div class="status-dot" id="status-dot"></div>
          <span id="status">Disconnected</span>
        </div>
      </div>
      <canvas id="game"></canvas>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
