<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BATTLE ROYALE | TikTok Interactive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --primary: #00ff41;
        --primary-glow: rgba(0, 255, 65, 0.4);
        --accent: #00e5ff;
        --bg-dark: #0a0a0a;
        --panel-bg: rgba(20, 20, 20, 0.85);
        --glass-border: rgba(255, 255, 255, 0.1);
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      
      body { 
        background: var(--bg-dark); 
        color: white;
        display: flex; 
        justify-content: center; 
        align-items: center; 
        height: 100vh; 
        overflow: hidden;
        font-family: 'Inter', sans-serif;
      }

      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      canvas { 
        display: block; 
        width: 100%;
        height: 100%;
      }

      /* Premium Panel Style */
      #connector {
        position: absolute;
        z-index: 100;
        background: var(--panel-bg);
        padding: 2.5rem;
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        backdrop-filter: blur(20px);
        display: flex;
        flex-direction: column;
        gap: 1.2rem;
        width: 380px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }

      #connector h1 {
        font-family: 'Orbitron', sans-serif;
        font-size: 1.4rem;
        text-align: center;
        letter-spacing: 2px;
        margin-bottom: 0.5rem;
        background: linear-gradient(90deg, #fff, var(--primary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 900;
      }

      #close-btn {
        position: absolute;
        top: 15px;
        right: 15px;
        background: rgba(255, 255, 255, 0.05);
        border: none;
        color: #666;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        transition: all 0.3s;
      }

      #close-btn:hover {
        background: rgba(255, 0, 0, 0.2);
        color: white;
      }

      .input-group {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      input {
        padding: 1rem 1.2rem;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid #333;
        color: white;
        border-radius: 12px;
        font-size: 1rem;
        outline: none;
        transition: all 0.3s;
        border-left: 4px solid #333;
      }

      input:focus {
        border-color: var(--primary);
        border-left-color: var(--primary);
        background: rgba(0, 255, 65, 0.05);
        box-shadow: 0 0 15px var(--primary-glow);
      }

      .btn-container {
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
        margin-top: 0.5rem;
      }

      button {
        padding: 1rem;
        border: none;
        color: black;
        font-weight: bold;
        cursor: pointer;
        border-radius: 12px;
        font-family: 'Orbitron', sans-serif;
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: all 0.3s;
        position: relative;
        overflow: hidden;
      }

      #connect-btn {
        background: linear-gradient(135deg, var(--primary), #00cc33);
        box-shadow: 0 4px 15px var(--primary-glow);
      }

      #connect-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px var(--primary-glow);
        filter: brightness(1.1);
      }

      #test-btn {
        background: rgba(255, 255, 255, 0.05);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      #test-btn:hover {
        background: rgba(255, 255, 255, 0.15);
        border-color: var(--accent);
        color: var(--accent);
        box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
      }

      button:active {
        transform: translateY(0);
      }

      #status-container {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 5px;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ff4b2b;
        box-shadow: 0 0 8px #ff4b2b;
      }

      .status-dot.online {
        background: var(--primary);
        box-shadow: 0 0 8px var(--primary);
        animation: pulse 2s infinite;
      }

      #status { 
        color: #888; 
        font-size: 0.75rem; 
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      @keyframes pulse {
        0% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.5); opacity: 0.5; }
        100% { transform: scale(1); opacity: 1; }
      }

      .hidden {
        opacity: 0;
        pointer-events: none;
        transform: scale(0.9) translateY(20px);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="connector">
        <button id="close-btn" title="Hide Menu">✕</button>
        <h1>BATTLE ARENA</h1>
        
        <div class="input-group">
          <input type="text" id="username" placeholder="TikTok Username" autocomplete="off" />
        </div>

        <div class="btn-container">
          <button id="connect-btn">Connect Live</button>
          <button id="test-btn">Test Arena Mode</button>
        </div>

        <div id="status-container">
          <div class="status-dot" id="status-dot"></div>
          <span id="status">Disconnected</span>
        </div>
      </div>
      <canvas id="game"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
